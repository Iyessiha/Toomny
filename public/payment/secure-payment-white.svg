<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80">
  <!-- Background -->
  <rect width="480" height="80" fill="white" rx="8"/>

  <!-- "Paiement sécurisé" label -->
  <text x="16" y="36" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#666" text-anchor="start">Paiement</text>
  <text x="16" y="50" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#666" text-anchor="start">sécurisé</text>
  <!-- Lock icon -->
  <rect x="20" y="56" width="12" height="10" rx="1" fill="#666"/>
  <path d="M22 56 Q22 50 26 50 Q30 50 30 56" stroke="#666" stroke-width="2" fill="none"/>

  <!-- Divider -->
  <line x1="58" y1="12" x2="58" y2="68" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Wave -->
  <circle cx="94" cy="40" r="26" fill="#4ad0f8"/>
  <text x="94" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="white">Wave</text>

  <!-- Orange Money -->
  <circle cx="162" cy="40" r="26" fill="#FF6600"/>
  <text x="162" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="9" fill="white">Orange</text>
  <text x="162" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="8" fill="white">Money</text>

  <!-- MTN -->
  <circle cx="230" cy="40" r="26" fill="#FFCB00"/>
  <text x="230" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="13" fill="#1A1A1A">MTN</text>

  <!-- Moov -->
  <circle cx="298" cy="40" r="26" fill="#2980B9"/>
  <text x="298" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="13" fill="white">Moov</text>

  <!-- Card -->
  <circle cx="366" cy="40" r="26" fill="#2ECC71"/>
  <rect x="351" y="30" width="30" height="20" rx="3" fill="white" opacity="0.9"/>
  <rect x="351" y="34" width="30" height="5" fill="#1A1A1A" opacity="0.7"/>
  <rect x="355" y="42" width="8" height="5" rx="1" fill="#F1C40F"/>

  <!-- SSL badge area -->
  <rect x="404" y="20" width="62" height="40" rx="4" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="435" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#2ECC71">SSL</text>
  <text x="435" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#666">Sécurisé</text>
</svg>
